plugins {
    id 'com.android.application'
}

// The reader itself lives at the repo root (index.html, vendor/, icons/).
// It is copied into the APK's assets at build time, so there is only one copy to edit.
def webOut = layout.buildDirectory.dir('webassets')
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'manifest.webmanifest', 'vendor/**', 'icons/**'
    }
    into(webOut.map { it.dir('www') })
}

android {
    namespace 'app.moye.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'app.moye.reader'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: '1.0.0')
    }

    // The signing key is not kept in the repo. Put it at android/moye.jks to get an APK that can
    // update an earlier install; without it the build falls back to the debug key.
    def keystore = rootProject.file('moye.jks')
    signingConfigs {
        if (keystore.exists()) {
            release {
                storeFile keystore
                storePassword System.getenv('MOYE_KEY_PASSWORD') ?: 'moyereader'
                keyAlias 'moye'
                keyPassword System.getenv('MOYE_KEY_PASSWORD') ?: 'moyereader'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir(webOut)
        }
    }

    lint {
        checkReleaseBuilds false
    }
}

tasks.named('preBuild') { dependsOn copyWeb }

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}
